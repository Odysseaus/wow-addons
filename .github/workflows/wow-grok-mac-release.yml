# Build WoWGrok.app on macOS and attach to a GitHub Release.
name: wow-grok-mac-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. wow-grok-mac-v0.1.6)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    # Hosted fallback when Odysseaus asks: runs-on: macos-latest
    runs-on: [self-hosted, macOS, wow-addons-mac]
    defaults:
      run:
        working-directory: wow-grok
    env:
      # Self-hosted: do not mkdir /Users/runner (hosted image path)
      AGENT_TOOLSDIRECTORY: /Users/gbundt/actions-runner/wow-addons/hostedtoolcache
      RUNNER_TOOL_CACHE: /Users/gbundt/actions-runner/wow-addons/hostedtoolcache
    steps:
      - uses: actions/checkout@v4

      # setup-python's macOS pkg installer needs sudo + /Users/runner; use preinstalled 3.12 on the MacBook runner
      - name: Use preinstalled Python 3.12
        run: |
          set -euo pipefail
          CANDIDATES=(
            "$HOME/.local/share/uv/python/cpython-3.12-macos-aarch64-none/bin"
            "$HOME/Library/Frameworks/Python.framework/Versions/3.12/bin"
            "$HOME/actions-runner/wow-addons/hostedtoolcache/Python/3.12.10/arm64/bin"
          )
          for d in "${CANDIDATES[@]}"; do
            if [[ -x "$d/python3.12" ]]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "Using $d/python3.12"
              "$d/python3.12" --version
              exit 0
            fi
          done
          echo "Python 3.12 not found on self-hosted runner" >&2
          exit 1

      - name: Install deps
        run: |
          python3.12 -m pip install -U pip
          python3.12 -m pip install pillow pyinstaller rumps certifi

      - name: Build .app
        run: python3.12 -m PyInstaller --noconfirm bridge_py/build_mac.spec

      - name: Prove supervisor is in the bundle
        run: |
          python3.12 <<'PY'
          from pathlib import Path
          app = Path("dist/WoWGrok.app")
          needle = b"bridge_py.supervisor"
          hits = list(app.rglob("*supervisor*"))
          print("path hits:", hits)
          found = False
          for p in app.rglob("*"):
              if not p.is_file() or p.stat().st_size > 80_000_000:
                  continue
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              if needle in data:
                  print("found", needle.decode(), "in", p)
                  found = True
                  break
          if not found and not hits:
              raise SystemExit("supervisor module not found in bundle")
          print("OK: supervisor present in bundle")
          PY

      - name: Prove menubar + LSUIElement
        run: |
          python3.12 <<'PY'
          from pathlib import Path
          app = Path("dist/WoWGrok.app")
          plist = next(app.rglob("Info.plist"))
          raw = plist.read_bytes()
          # binary or XML plist — accept either form of the key
          if b"LSUIElement" not in raw and b"lsuielement" not in raw.lower():
              # try plutil
              import subprocess, json
              out = subprocess.check_output(["plutil", "-convert", "json", "-o", "-", str(plist)])
              data = json.loads(out)
              if not data.get("LSUIElement"):
                  raise SystemExit(f"LSUIElement missing in {plist}: {data}")
          print("OK: LSUIElement present in", plist)
          needle = b"bridge_py.menubar"
          found = any(needle in p.read_bytes() for p in app.rglob("*") if p.is_file() and p.stat().st_size < 80_000_000)
          if not found:
              # rumps string also acceptable evidence of menubar path
              found = any(b"rumps" in p.read_bytes() for p in app.rglob("*") if p.is_file() and 1000 < p.stat().st_size < 80_000_000)
          if not found:
              raise SystemExit("menubar/rumps not found in bundle")
          print("OK: menubar/rumps present in bundle")
          PY

      - name: Zip .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent WoWGrok.app WoWGrok-mac-arm64.zip

      - name: Make DMG (create-dmg drag-to-Applications)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install create-dmg
          STAGE="dist/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R dist/WoWGrok.app "$STAGE/"
          rm -f dist/WoWGrok.dmg
          # create-dmg may exit non-zero after a successful image (bless); accept if DMG exists
          create-dmg \
            --volname "WoWGrok" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "WoWGrok.app" 150 185 \
            --hide-extension "WoWGrok.app" \
            --app-drop-link 450 185 \
            "dist/WoWGrok.dmg" \
            "$STAGE/" || true
          if [[ ! -f dist/WoWGrok.dmg ]]; then
            echo "create-dmg failed; falling back to hdiutil of staged folder"
            hdiutil create -volname WoWGrok -srcfolder "$STAGE" -ov -format UDZO dist/WoWGrok.dmg
          fi
          ls -la dist/WoWGrok.dmg


      - name: Create / update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRE: ${{ inputs.prerelease }}
        working-directory: .
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          NOTES=$(cat <<MD
          ## WoWGrok Mac ${TAG#wow-grok-mac-}

          Built from commit ${SHA} via GitHub Actions (macos-14, Apple Silicon arm64, unsigned).

          ### Product path (v0.1.21)
          - Trunk: **0.1.13** pixel Send + strip SetScale(768 / physH); RecordFor still 7-field (no ctx).
          - Plus: panel version title + **shift-click ExpandLinks** only (from 0.1.20 BuildUI / ExpandLinks).
          - Bridge/app capture: **0.1.19** capture_mac (CG strip / screencapture -l) + permissionPaused resume smoke.
          - **Not included:** GameContext / ContextToSend / RecordFor ctx / hello ctx / `/wow-grok context` / SafeReload-on-Send / loadfile Inbox / SetScale(1) / capturePaused chat UX from 0.1.14–0.1.20.

          ### Set up in 2 to 3 minutes
          1. **Download the app and addon.** Open the DMG, drag \`WoWGrok.app\` to Applications, then eject. Gatekeeper (unsigned): **Control-click → Open**, then **Open Anyway** if shown. Confirm your AddOns folder — the app creates the addon and reply slots.
          2. **Connect your AI.** Choose xAI (Enter = default) or Claude, paste that API key, and wait for **Done**. Grant **Screen Recording**, Quit/reopen once if offered, then leave the **menu bar** companion running. The key stays in local \`config.json\` under Application Support.
          3. **Start questing.** Use Windowed or Windowed (Fullscreen) / borderless, fully restart Forever, enable WoW Grok, and type \`/wow-grok\` or \`/grok\`.

          When you are done later, menu bar → **Quit WoWGrok** (stops the app; not part of opening or using the AddOn).
          Full guide and fair questions: https://github.com/Odysseaus/wow-addons/blob/main/wow-grok/docs/INSTALL-MAC.md

          Zip of .app is also attached for convenience.
          MD
          )
          PRE_FLAG=()
          if [[ "$PRE" == "true" ]]; then PRE_FLAG=(--prerelease); fi
          TITLE="WoW Grok Mac ${TAG#wow-grok-mac-v} — trunk 0.1.13 + links + 0.1.19 capture"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              wow-grok/dist/WoWGrok-mac-arm64.zip \
              wow-grok/dist/WoWGrok.dmg \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${{ github.repository }}" ${PRE_FLAG[@]+"${PRE_FLAG[@]}"}
          else
            gh release create "$TAG" \
              wow-grok/dist/WoWGrok-mac-arm64.zip \
              wow-grok/dist/WoWGrok.dmg \
              --title "$TITLE" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}" \
              ${PRE_FLAG[@]+"${PRE_FLAG[@]}"}
          fi
