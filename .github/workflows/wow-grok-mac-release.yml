# Build WoWGrok.app on macOS and attach to a GitHub Release.
name: wow-grok-mac-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. wow-grok-mac-v0.1.6)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: wow-grok
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install pillow pyinstaller rumps

      - name: Build .app
        run: pyinstaller --noconfirm bridge_py/build_mac.spec

      - name: Prove supervisor is in the bundle
        run: |
          python <<'PY'
          from pathlib import Path
          app = Path("dist/WoWGrok.app")
          needle = b"bridge_py.supervisor"
          hits = list(app.rglob("*supervisor*"))
          print("path hits:", hits)
          found = False
          for p in app.rglob("*"):
              if not p.is_file() or p.stat().st_size > 80_000_000:
                  continue
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              if needle in data:
                  print("found", needle.decode(), "in", p)
                  found = True
                  break
          if not found and not hits:
              raise SystemExit("supervisor module not found in bundle")
          print("OK: supervisor present in bundle")
          PY

      - name: Prove menubar + LSUIElement
        run: |
          python <<'PY'
          from pathlib import Path
          app = Path("dist/WoWGrok.app")
          plist = next(app.rglob("Info.plist"))
          raw = plist.read_bytes()
          # binary or XML plist — accept either form of the key
          if b"LSUIElement" not in raw and b"lsuielement" not in raw.lower():
              # try plutil
              import subprocess, json
              out = subprocess.check_output(["plutil", "-convert", "json", "-o", "-", str(plist)])
              data = json.loads(out)
              if not data.get("LSUIElement"):
                  raise SystemExit(f"LSUIElement missing in {plist}: {data}")
          print("OK: LSUIElement present in", plist)
          needle = b"bridge_py.menubar"
          found = any(needle in p.read_bytes() for p in app.rglob("*") if p.is_file() and p.stat().st_size < 80_000_000)
          if not found:
              # rumps string also acceptable evidence of menubar path
              found = any(b"rumps" in p.read_bytes() for p in app.rglob("*") if p.is_file() and 1000 < p.stat().st_size < 80_000_000)
          if not found:
              raise SystemExit("menubar/rumps not found in bundle")
          print("OK: menubar/rumps present in bundle")
          PY

      - name: Zip .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent WoWGrok.app WoWGrok-mac-arm64.zip

      - name: Make DMG (create-dmg drag-to-Applications)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install create-dmg
          STAGE="dist/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R dist/WoWGrok.app "$STAGE/"
          rm -f dist/WoWGrok.dmg
          # create-dmg may exit non-zero after a successful image (bless); accept if DMG exists
          create-dmg \
            --volname "WoWGrok" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "WoWGrok.app" 150 185 \
            --hide-extension "WoWGrok.app" \
            --app-drop-link 450 185 \
            "dist/WoWGrok.dmg" \
            "$STAGE/" || true
          if [[ ! -f dist/WoWGrok.dmg ]]; then
            echo "create-dmg failed; falling back to hdiutil of staged folder"
            hdiutil create -volname WoWGrok -srcfolder "$STAGE" -ov -format UDZO dist/WoWGrok.dmg
          fi
          ls -la dist/WoWGrok.dmg

      - name: Create / update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRE: ${{ inputs.prerelease }}
        working-directory: .
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          NOTES=$(cat <<MD
          ## WoWGrok Mac ${TAG#wow-grok-mac-}

          Built from commit \`${SHA}\` via GitHub Actions (macos-14, Apple Silicon arm64, unsigned).

          ### What’s new in 0.1.11
          - **Connect via presence:** Note the bridge when presence head>0 (don’t wait for the next 30s beat); Connect seeds from presence; CONNECT_WAIT 45s.
          - **Screen Recording TCC:** in-process CoreGraphics probe/request (ctypes) so macOS lists **WoWGrok** under Screen Recording — not osascript.
          - **First-run sheet:** always show the Screen Recording sheet unless status is clearly granted (do not skip on unsure); call `request_screen_recording()` so Settings gets a WoWGrok row.
          - Quit + reopen after enabling remains required for the permission to stick.

          ### Carry-forward from 0.1.10
          - **Quit full-tree teardown:** menu-bar Quit terminates supervisor → bridge → capture so Finder can trash/replace `/Applications/WoWGrok.app`.

          ### Carry-forward from 0.1.9
          - **Presence beats:** rewrite full valid prefix 1..k each beat so Forever can detect the bridge.
          - **Capture window match:** do not attach to WoWGrok itself; skip wowgrok owners.

          ### Carry-forward from 0.1.6
          - **DMG layout:** drag \`WoWGrok.app\` to the Applications shortcut (create-dmg).
          - **Menu bar companion:** quiet status item (Running + Quit); \`LSUIElement\`.
          - Install into **/Applications**; keep running while you play.

          ### Install
          1. Quit any old WoWGrok process.
          2. Open the DMG → drag **WoWGrok.app** to **Applications** → eject.
          3. Hold **Control** → click → **Open** if Gatekeeper warns (plain double-click often only shows Done).
          4. Enter API key → confirm AddOns → wait for slot install.
          5. Grant **Screen Recording**; use Quit from the menu once if offered so permission sticks, then reopen.
          6. Leave WoWGrok running (menu bar) while you play. Type \`/wow-grok\` or \`/grok\` in game chat.

          Zip of \`.app\` is also attached for convenience.
          MD
          )
          PRE_FLAG=()
          if [[ "$PRE" == "true" ]]; then PRE_FLAG=(--prerelease); fi
          TITLE="WoW Grok Mac ${TAG#wow-grok-mac-} — Connect presence + Screen Recording TCC"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              wow-grok/dist/WoWGrok-mac-arm64.zip \
              wow-grok/dist/WoWGrok.dmg \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${{ github.repository }}" ${PRE_FLAG[@]+"${PRE_FLAG[@]}"}
          else
            gh release create "$TAG" \
              wow-grok/dist/WoWGrok-mac-arm64.zip \
              wow-grok/dist/WoWGrok.dmg \
              --title "$TITLE" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}" \
              ${PRE_FLAG[@]+"${PRE_FLAG[@]}"}
          fi
