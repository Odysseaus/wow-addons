# Build WoWGrok.exe on Windows and attach to a GitHub Release.
name: wow-grok-win-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. wow-grok-win-v0.1.31)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wow-grok
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install pillow certifi pyinstaller pystray

      - name: Inject version from tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#wow-grok-win-v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not parse semver from tag=$TAG (got VER=$VER)" >&2
            exit 1
          fi
          echo "Injecting __version__=$VER"
          python - <<PY
          from pathlib import Path
          import re
          ver = "$VER"
          init = Path("bridge_py/__init__.py")
          text = init.read_text(encoding="utf-8")
          text2 = re.sub(
              r'__version__\s*=\s*["\'][^"\']+["\']',
              f'__version__ = "{ver}"',
              text,
          )
          if f'__version__ = "{ver}"' not in text2:
              raise SystemExit("version inject failed")
          init.write_text(text2, encoding="utf-8")
          print("OK: injected", ver)
          print("TOC left unchanged (addon stays 0.1.22)")
          PY

      - name: Build .exe
        shell: bash
        run: pyinstaller --noconfirm bridge_py/build_win.spec

      - name: Prove tray + ssl modules in freeze archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          exe = Path("dist/WoWGrok.exe")
          if not exe.is_file():
              raise SystemExit(f"missing {exe}")
          size = exe.stat().st_size
          print("exe bytes", size)
          if size < 5_000_000:
              raise SystemExit("exe suspiciously small")
          # onefile stores archive after bootloader; string scan is enough for gate
          data = exe.read_bytes()
          for needle in (b"tray_win", b"pystray", b"ssl_certs", b"certifi", b"secret_store"):
              if needle not in data:
                  raise SystemExit(f"missing {needle!r} in exe")
              print("OK found", needle.decode())
          PY

      - name: SSL smoke (frozen exe)
        shell: bash
        run: |
          set -euo pipefail
          # Windowed (console=False) exe still returns a process exit code.
          set +e
          ./dist/WoWGrok.exe --ssl-smoke
          rc=$?
          set -e
          echo "ssl-smoke exit=$rc"
          if [[ "$rc" -ne 0 ]]; then
            echo "SSL smoke failed (want 0 = HTTPS auth error, not CERTIFICATE_VERIFY_FAILED)" >&2
            exit "$rc"
          fi

      - name: Create / update Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRE: ${{ inputs.prerelease }}
        working-directory: .
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          NOTES=$(cat <<MD
          ## WoWGrok Windows ${TAG#wow-grok-win-}

          Built from commit ${SHA} via GitHub Actions (windows-latest, unsigned). Includes PR #48 onboard changes.

          ### What's new in 0.1.31 (PR #48)
          - **Wizard gate**: opens on version bump **OR** missing/invalid API key (not every launch when key is healthy).
          - **xAI + Claude only** — no legacy provider paths.
          - **No legacy Tk popups** — onboard wizard is the setup UI.
          - Tray menu **Setup…** to re-open the wizard; menu shows **app version**.
          - API keys in Windows Credential Manager (`WoWGrok/apiKey`); fallback to `config.json` if that write fails.
          - Tray **Running** + **Quit** (pystray); SSL / `--ssl-smoke`.

          ### Product pin
          - First-run / Setup: choose **xAI** or **Claude**. Enter / default keeps **xAI**.
          - Claude uses Anthropic Messages API (`claudeApiKey` or `ANTHROPIC_API_KEY`, model `claude-sonnet-4-5`). xAI stays `provider: xai`, model `grok-4-latest`.
          - Default timeoutMs **1800000** (30m). Existing configs kept.
          - This build does **not** set webSearch/xSearch and does **not** attach xAI `web_search` / `x_search` tools.
          - Healthy pixel Send does **not** call ReloadUI (reload remains the non-pixel fallback).
          - In-game addon TOC stays **0.1.22**.

          ### Set up in 2 to 3 minutes
          1. **Download the app. It installs the addon.** Run `WoWGrok.exe`. It is unsigned, so if SmartScreen says "Windows protected your PC", click **More info → Run anyway**. Confirm your AddOns folder.
          2. **Connect your AI.** Choose xAI (Enter = default) or Claude, paste that API key, and wait for **Done** while it writes the addon and reply slots. Keys go to Credential Manager when possible.
          3. **Log in and play.** Leave the tray icon **Running**. Use Windowed or Windowed (Fullscreen), fully restart WoW, enable WoW Grok, and type `/wow-grok` or `/grok`.

          When you are done later, tray → **Quit** (stops the app; not part of opening or using the AddOn). Re-open setup anytime via tray → **Setup…**.
          Full guide: https://github.com/Odysseaus/wow-addons/blob/main/wow-grok/docs/INSTALL-WINDOWS.md

          Mac counterpart: https://github.com/Odysseaus/wow-addons/releases/tag/wow-grok-mac-v0.1.27
          MD
          )
          PRE_FLAG=()
          if [[ "$PRE" == "true" ]]; then PRE_FLAG=(--prerelease); fi
          TITLE="WoW Grok Windows v0.1.31 — onboard wizard gate; xAI+Claude; Setup…; menu version (#48)"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              wow-grok/dist/WoWGrok.exe \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${{ github.repository }}" ${PRE_FLAG[@]+"${PRE_FLAG[@]}"}
          else
            gh release create "$TAG" \
              wow-grok/dist/WoWGrok.exe \
              --title "$TITLE" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}" \
              ${PRE_FLAG[@]+"${PRE_FLAG[@]}"}
          fi
