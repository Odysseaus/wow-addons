# Build WoWGrok.exe on Windows and attach to a GitHub Release.
name: wow-grok-win-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. wow-grok-win-v0.1.28)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wow-grok
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install pillow certifi pyinstaller pystray

      - name: Inject version from tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#wow-grok-win-v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not parse semver from tag=$TAG (got VER=$VER)" >&2
            exit 1
          fi
          echo "Injecting __version__=$VER"
          python - <<PY
          from pathlib import Path
          import re
          ver = "$VER"
          init = Path("bridge_py/__init__.py")
          text = init.read_text(encoding="utf-8")
          text2 = re.sub(
              r'__version__\s*=\s*["\'][^"\']+["\']',
              f'__version__ = "{ver}"',
              text,
          )
          if f'__version__ = "{ver}"' not in text2:
              raise SystemExit("version inject failed")
          init.write_text(text2, encoding="utf-8")
          print("OK: injected", ver)
          print("TOC left unchanged (addon stays 0.1.22)")
          PY

      - name: Build .exe
        shell: bash
        run: pyinstaller --noconfirm bridge_py/build_win.spec

      - name: Prove tray + ssl modules in freeze archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          exe = Path("dist/WoWGrok.exe")
          if not exe.is_file():
              raise SystemExit(f"missing {exe}")
          size = exe.stat().st_size
          print("exe bytes", size)
          if size < 5_000_000:
              raise SystemExit("exe suspiciously small")
          # onefile stores archive after bootloader; string scan is enough for gate
          data = exe.read_bytes()
          for needle in (b"tray_win", b"pystray", b"ssl_certs", b"certifi", b"secret_store", b"onboard_wizard"):
              if needle not in data:
                  raise SystemExit(f"missing {needle!r} in exe")
              print("OK found", needle.decode())
          PY

      - name: SSL smoke (frozen exe)
        shell: bash
        run: |
          set -euo pipefail
          # Windowed (console=False) exe still returns a process exit code.
          set +e
          ./dist/WoWGrok.exe --ssl-smoke
          rc=$?
          set -e
          echo "ssl-smoke exit=$rc"
          if [[ "$rc" -ne 0 ]]; then
            echo "SSL smoke failed (want 0 = HTTPS auth error, not CERTIFICATE_VERIFY_FAILED)" >&2
            exit "$rc"
          fi

      - name: Create / update Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRE: ${{ inputs.prerelease }}
        working-directory: .
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          NOTES=$(cat <<MD
          ## WoWGrok Windows ${TAG#wow-grok-win-}

          Built from commit ${SHA} via GitHub Actions (windows-latest, unsigned).

          ### New in 0.1.28 — NQA-style onboarding wizard (PR #36, main a88d69c)
          - First launch opens a dark two-pane **WoWGrok** setup wizard: **Download → Connect your AI → Say hi in game**.
          - Provider picker: **Grok (xAI)** (default) and **Claude** connect with a real API-key flow. ChatGPT / Gemini / Other show as Coming soon.
          - xAI stays \`provider: xai\`, model \`grok-4-latest\`. Claude uses the Anthropic Messages API (\`claudeApiKey\` or \`ANTHROPIC_API_KEY\`, model \`claude-sonnet-4-5\`).
          - API keys (\`apiKey\`, \`claudeApiKey\`) are stored in **Windows Credential Manager** (\`WoWGrok/apiKey\`, \`WoWGrok/claudeApiKey\`); existing \`config.json\` keys migrate on next launch, and if the write fails the key stays in \`config.json\`.
          - Default timeoutMs **1800000** (30m). Existing configs kept. Headless CLI unchanged.
          - In-game addon TOC stays **0.1.22**.
          - Tray **Running** + **Quit** (pystray); SSL / \`--ssl-smoke\`.

          ### Set up in 2 to 3 minutes (wizard)
          1. **Download.** Run \`WoWGrok.exe\`. It is unsigned (not Authenticode signed), so if SmartScreen says "Windows protected your PC", click **More info → Run anyway**. The wizard installs the addon into your AddOns folder.
          2. **Connect your AI.** Pick Grok (xAI, default) or Claude, paste that API key, and wait for **Done** while it writes the addon and reply slots. Keys go to Windows Credential Manager.
          3. **Say hi in game.** Leave the tray icon **Running**. Use Windowed or Windowed (Fullscreen), fully restart WoW, enable WoW Grok, and type \`/wow-grok\` or \`/grok\`.

          When you are done later, tray → **Quit** (stops the app; not part of opening or using the AddOn).
          Full guide and fair questions: https://github.com/Odysseaus/wow-addons/blob/main/wow-grok/docs/INSTALL-WINDOWS.md

          Previous Windows build: https://github.com/Odysseaus/wow-addons/releases/tag/wow-grok-win-v0.1.27
          MD
          )
          PRE_FLAG=()
          if [[ "$PRE" == "true" ]]; then PRE_FLAG=(--prerelease); fi
          TITLE="WoW Grok Windows ${TAG#wow-grok-win-} — NQA-style onboarding wizard; tray + SSL"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              wow-grok/dist/WoWGrok.exe \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --repo "${{ github.repository }}" ${PRE_FLAG[@]+"${PRE_FLAG[@]}"}
          else
            gh release create "$TAG" \
              wow-grok/dist/WoWGrok.exe \
              --title "$TITLE" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}" \
              ${PRE_FLAG[@]+"${PRE_FLAG[@]}"}
          fi
