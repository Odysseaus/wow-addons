# Note: GitHub only runs workflows from the repository root `.github/`.
# If this file is under wow-grok/.github, copy or symlink to ../../.github for CI.
name: wow-grok-test
on:
  push:
    paths: ['wow-grok/**']
  pull_request:
    paths: ['wow-grok/**']
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
        working-directory: wow-grok
      - run: python -m unittest discover -s bridge_py/tests -v
        working-directory: wow-grok
